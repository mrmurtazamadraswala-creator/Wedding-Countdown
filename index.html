<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Wedding Countdown 💍</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.94);
            border-radius: 24px;
            padding: 40px 25px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        }
        .heart-icon { font-size: 2.8rem; margin-bottom: 12px; }
        h1 { color: #d63384; font-size: 1.6rem; font-weight: 700; }
        .subtitle { color: #777; font-size: 0.95rem; margin-top: 6px; }
        .counter-container {
            margin: 28px 0;
            background: #fff0f5;
            padding: 25px;
            border-radius: 20px;
            border: 2px dashed #f87171;
        }
        .days-number { font-size: 4.5rem; font-weight: 800; color: #9f1239; line-height: 1; }
        .days-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #be123c;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
        }
        .quote-box {
            background: #ffffff;
            padding: 22px 18px;
            border-radius: 16px;
            border: 1px solid #fee2e2;
        }
        .quote-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #999;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .quote-text { font-size: 1.05rem; color: #374151; font-style: italic; }
    </style>
</head>
<body>
<div class="card">
    <div class="heart-icon">💍</div>
    <h1>Counting Down to Forever</h1>
    <p class="subtitle">Until we say "I Do"</p>
    <div class="counter-container">
        <div class="days-number" id="days">--</div>
        <div class="days-label">Days Left</div>
    </div>
    <div class="quote-box">
        <div class="quote-title">Today's Daily Note</div>
        <div class="quote-text" id="quote">Loading love note...</div>
    </div>
</div>
<script>
    const weddingDate = new Date(2026, 10, 21);
    const marriageQuotes = [
        "Every love story is beautiful, but ours is my favorite.",
        "In you, I've found the love of my life and my best friend.",
        "To love and be loved is to feel the sun from both sides.",
        "Grow old along with me! The best is yet to be.",
        "Together is a wonderful place to be.",
        "I want all of my lasts to be with you.",
        "Forever is a long time, but I wouldn't mind spending it by your side.",
        "Two souls, one heart.",
        "You are my today and all of my tomorrows.",
        "My favorite place in the world is right next to you."
    ];
    function updateCounter() {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const difference = weddingDate - today;
        const daysLeft = Math.ceil(difference / (1000 * 60 * 60 * 24));
        document.getElementById("days").innerText = daysLeft > 0 ? daysLeft : 0;
        const startOfYear = new Date(today.getFullYear(), 0, 0);
        const diff = today - startOfYear;
        const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));
        const quoteIndex = dayOfYear % marriageQuotes.length;
        document.getElementById("quote").innerText = `"${marriageQuotes[quoteIndex]}"`;
    }
    updateCounter();
</script>
</body>
</html>
